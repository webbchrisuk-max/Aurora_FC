<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Clean — Finance</title><script src="aurora.js" defer></script></head>
<body data-page="finance">
<nav id="auroraNav"></nav><hr>
<h1>Finance</h1>
<p>Plain test page. Finance owns cash and mission release.</p>
<label>Available Cash <input id="financeAvailable" type="number" step="0.01"></label><br>
<label>Commitments <input id="financeCommitments" type="number" step="0.01"></label><br>
<label>Protected Cash <input id="financeProtected" type="number" step="0.01"></label><br>
<button id="financeCalculate" type="button">Calculate Safe Release</button>
<p>Safe Release: <strong id="financeSafeRelease">£0.00</strong></p>
<button id="financeRelease" type="button">Release Mission to Transfer</button>
<p>Mission: <strong id="financeMissionStatus">No active mission</strong></p>
</body></html>
