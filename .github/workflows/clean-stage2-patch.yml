name: Clean Scouting Stage 2 Patch

on:
  push:
    paths:
      - 'tools/patch_clean_stage2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Scouting Stage 2 source replacement
        run: python tools/patch_clean_stage2.py
      - name: Commit source replacement
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clean-rebuild/aurora.js
          git commit -m "Build clean Scouting Stage 2 allocation optimiser"
          git push
